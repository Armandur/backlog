<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projektsamtal</title>
<link rel="stylesheet" href="/pm-static/samtal.css">
</head>
<body>
<header>
  <h1 id="rubrik">Projektsamtal</h1>
  <p id="status" class="status"></p>
</header>

<main>
  <ol id="trad" class="trad" aria-live="polite"></ol>
</main>

<form id="skrivform" class="skriv">
  <label for="text" class="dold">Ditt inlägg</label>
  <textarea id="text" name="text" rows="3" placeholder="Skriv ett inlägg..." required></textarea>
  <div class="rad">
    <label for="aktor" class="dold">Aktör</label>
    <input id="aktor" name="aktor" value="human:rasmus" spellcheck="false">
    <label class="kryss"><input type="checkbox" id="fraga"> Fråga agenten</label>
    <button type="submit" id="skicka">Skicka</button>
  </div>
</form>

<script src="/pm-static/samtal.js"></script>
</body>
</html>
